<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planogram Builder</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/styles/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: var(--background); color: var(--foreground); }
        /* Override sidebar margin */
        .main-content { margin-left: 0 !important; width: 100vw !important; height: 100vh !important; }
        .pog-topbar-left h1 { font-size:1.4rem; font-weight:700; color: var(--foreground); }
        .pog-topbar-left p { font-size:0.85rem; color: var(--text-muted); margin-top:2px; }
        label { color: var(--foreground); }
    </style>
</head>
<body class="bg-background text-foreground">
    <main class="pog-page-layout bg-background" id="main-content">
        <!-- POG Top Bar -->
        <div class="pog-topbar bg-surface border-b border-border">
            <div class="pog-topbar-left">
                <h1>Tạo Planogram</h1>
                <p>Thiết kế sơ đồ trưng bày · Kéo sản phẩm vào kệ</p>
            </div>
            <div class="pog-topbar-center" style="display:flex;align-items:center;flex-wrap:wrap;gap:0.5rem;">
                <label style="font-size:0.85rem;font-weight:600;">Cửa hàng:</label>
                <select id="pogStoreSelector" class="pog-select bg-surface border-border text-foreground" style="min-width:140px;">
                    <option value="">-- Chọn cửa hàng --</option>
                </select>
                <button class="pog-btn-ghost text-foreground hover:bg-muted" id="pogBtnAddStore" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">＋ Cửa Hàng</button>
                <button class="pog-btn-ghost" id="pogBtnDeleteStore" style="padding: 0.3rem 0.6rem; font-size: 0.75rem; color: #ef4444; border-color: #ef4444;" title="Xóa cửa hàng hiện tại">✕</button>

                <label style="font-size:0.85rem;font-weight:600;margin-left:0.5rem;">Kệ đang chỉnh:</label>
                <select id="pogShelfSelector" class="pog-select bg-surface border-border text-foreground" style="min-width:100px;">
                    <option value="shelf-1">Kệ 1</option>
                </select>
                <button class="pog-btn-ghost text-foreground hover:bg-muted" id="pogBtnAddShelf">＋ Thêm Kệ</button>
            </div>
            <div class="pog-topbar-right" style="flex-wrap:wrap;">
                <button class="pog-btn-ghost" id="pogBtnImportAI" style="color: #06b6d4; border-color: #06b6d4; font-weight: 600;">✨ Import từ AI</button>
                <button class="pog-btn-ghost text-foreground hover:bg-muted" id="pogBtnAddProduct">＋ Sản Phẩm</button>
                <button class="btn btn-primary" id="pogBtnSave" style="width:auto;padding:0.5rem 1.2rem;font-size:0.85rem; background: #06b6d4; color: white;">Lưu</button>
            </div>
        </div>

        <!-- POG 3-column layout -->
        <div class="pog-layout bg-background">
            <aside class="pog-catalog-panel border-r border-border bg-surface/50">
                <div class="pog-panel-title text-foreground">Danh Mục Sản Phẩm <span class="pog-badge bg-primary text-primary-foreground" id="pogCatalogCount">0</span></div>
                <div class="pog-catalog" id="pogCatalog"></div>
            </aside>
            <main class="pog-canvas-area bg-background">
                <div class="pog-fixture" id="pogFixture"></div>
            </main>
            <aside class="pog-props-panel border-l border-border bg-surface/50">
                <div class="pog-panel-title text-foreground">Thuộc Tính</div>
                <div id="pogPropsContent" class="pog-props-body">
                    <p class="pog-empty-state text-muted-foreground">Bấm vào kệ để cấu hình số tầng, số sản phẩm tối đa và tên tầng.</p>
                </div>
            </aside>
        </div>

        <!-- MODAL: Add Store -->
        <div class="modal-backdrop hidden" id="pogModalAddStore">
            <div class="modal-card bg-surface border border-border">
                <div class="modal-card-header border-b border-border">
                    <span class="text-foreground">Thêm Cửa Hàng Mới</span>
                    <button class="modal-x text-muted-foreground" id="pogStoreModalClose">✕</button>
                </div>
                <div class="modal-card-body">
                    <div class="modal-field">
                        <label class="text-foreground">Tên cửa hàng *</label>
                        <input type="text" id="pogStoreName" class="pog-input bg-background border-border text-foreground" placeholder="VD: Cửa hàng Cầu Giấy">
                    </div>
                </div>
                <div class="modal-card-footer border-t border-border">
                    <button class="pog-btn-ghost text-foreground" id="pogStoreModalCancel">Hủy</button>
                    <button class="btn btn-primary bg-primary text-primary-foreground" id="pogStoreModalConfirm">Tạo Mới</button>
                </div>
            </div>
        </div>

        <!-- MODAL: Add Product -->
        <div class="modal-backdrop hidden" id="pogModalAddProduct">
            <div class="modal-card bg-surface border border-border">
                <div class="modal-card-header border-b border-border">
                    <span class="text-foreground">Thêm Sản Phẩm Mới</span>
                    <button class="modal-x text-muted-foreground" id="pogModalClose">✕</button>
                </div>
                <div class="modal-card-body">
                    <div class="modal-field"><label class="text-foreground">Tên sản phẩm *</label><input type="text" id="pogProdName" class="pog-input bg-background border-border text-foreground"></div>
                    <div class="modal-field"><label class="text-foreground">Mã SKU</label><input type="text" id="pogProdCode" class="pog-input bg-background border-border text-foreground"></div>
                    <div class="modal-field"><label class="text-foreground">Danh mục</label><input type="text" id="pogProdCategory" class="pog-input bg-background border-border text-foreground"></div>
                    <div class="modal-field"><label class="text-foreground">Màu đại diện</label><input type="color" id="pogProdColor" class="pog-color-input" value="#6366f1"></div>
                </div>
                <div class="modal-card-footer border-t border-border">
                    <button class="pog-btn-ghost text-foreground" id="pogModalCancel">Hủy</button>
                    <button class="btn btn-primary bg-primary text-primary-foreground" id="pogModalConfirm">Thêm</button>
                </div>
            </div>
        </div>
        <div class="pog-toast hidden" id="pogToast"></div>
    </main>
    <script type="module" src="/src/utils/shared.js"></script>
    <script type="module" src="/src/features/planogram/planogram.js"></script>
</body>
</html>
