<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hợp Đồng Nhãn Hàng | POG Manager</title>
    <meta name="description" content="Quản lý thỏa thuận trưng bày với các nhà cung cấp">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── Contract grid ───────────────────────────────────── */
        .contracts-dynamic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .contract-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.1rem 1.2rem;
            transition: border-color .2s, box-shadow .2s;
            position: relative;
        }
        .contract-card:hover { border-color: var(--accent); box-shadow: 0 4px 20px rgba(99,102,241,.15); }

        .contract-delete-btn {
            position: absolute; top: .7rem; right: .7rem;
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); padding: 4px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: color .2s, background .2s;
        }
        .contract-delete-btn svg { width: 16px; height: 16px; }
        .contract-delete-btn:hover { color: #ef4444; background: rgba(239,68,68,.1); }

        .empty-contracts {
            grid-column: 1/-1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .empty-contracts svg { width: 56px; height: 56px; margin-bottom: 1rem; opacity: .4; }
        .empty-contracts p { font-size: 1rem; font-weight: 500; margin-bottom: .3rem; }
        .empty-contracts span { font-size: .85rem; }

        /* ── Toast ───────────────────────────────────────────── */
        .hd-toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(10px);
            padding: .75rem 1.5rem; border-radius: 10px; font-size: .9rem; font-weight: 500;
            opacity: 0; transition: all .3s; pointer-events: none; z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,.25);
        }
        .hd-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        .hd-toast-success { background: #10b981; color: #fff; }
        .hd-toast-error   { background: #ef4444; color: #fff; }
        .hd-toast-info    { background: var(--accent); color: #fff; }

        /* ── Popup overlay ───────────────────────────────────── */
        .popup-overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity .25s;
        }
        .popup-overlay.active { opacity: 1; pointer-events: all; }

        .popup-modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 560px;
            max-width: calc(100vw - 2rem);
            max-height: 90vh;
            display: flex; flex-direction: column;
            overflow: hidden;
            transform: scale(.96) translateY(12px);
            transition: transform .25s;
            box-shadow: 0 24px 80px rgba(0,0,0,.4);
        }
        .popup-overlay.active .popup-modal { transform: scale(1) translateY(0); }

        .popup-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.25rem 1.5rem 1rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .popup-header h3 { font-size: 1.05rem; font-weight: 700; }
        .popup-close {
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); display: flex; padding: 4px;
            border-radius: 8px; transition: color .2s, background .2s;
        }
        .popup-close:hover { color: #ef4444; background: rgba(239,68,68,.1); }
        .popup-close svg { width: 20px; height: 20px; }

        /* ── Wizard steps indicator ──────────────────────────── */
        .wizard-steps {
            display: flex; align-items: center; gap: .5rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .wizard-step-dot {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .75rem; font-weight: 700;
            background: var(--surface-2); color: var(--text-muted);
            border: 2px solid var(--border);
            transition: all .2s; flex-shrink: 0;
        }
        .wizard-step-dot.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .wizard-step-dot.done   { background: #10b981; color: #fff; border-color: #10b981; }
        .wizard-connector { flex: 1; height: 2px; background: var(--border); border-radius: 2px; }
        .wizard-step-label {
            font-size: .8rem; color: var(--text-muted);
            padding-left: .75rem; border-left: 1px solid var(--border);
            margin-left: auto; white-space: nowrap;
        }

        /* ── Wizard body ─────────────────────────────────────── */
        .wizard-body {
            flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem;
            display: flex; flex-direction: column; gap: 1rem;
        }
        .wizard-loading {
            text-align: center; padding: 2rem;
            color: var(--text-muted); font-size: .9rem;
        }
        .wizard-empty {
            text-align: center; padding: 2rem 1rem;
            color: var(--text-muted);
        }
        .wizard-empty p { font-weight: 500; margin-bottom: .35rem; }
        .wizard-footer {
            display: flex; gap: .75rem; justify-content: flex-end;
            padding-top: .75rem; border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* ── Brand cards ─────────────────────────────────────── */
        .wizard-search { position: sticky; top: 0; background: var(--surface); z-index: 1; padding-bottom: .5rem; }
        .brand-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: .6rem; max-height: 320px; overflow-y: auto;
            padding-right: 4px;
        }
        .brand-card {
            display: flex; align-items: center; gap: .75rem;
            padding: .75rem; border-radius: 12px;
            border: 2px solid var(--border); cursor: pointer;
            transition: all .15s; position: relative;
            background: var(--surface-2);
        }
        .brand-card:hover { border-color: var(--accent); background: rgba(99,102,241,.05); }
        .brand-card.selected { border-color: var(--accent); background: rgba(99,102,241,.08); }
        .brand-avatar {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 700; color: #fff;
            flex-shrink: 0;
        }
        .brand-card-info { flex: 1; min-width: 0; }
        .brand-card-name { display: block; font-size: .85rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .brand-card-code { font-size: .72rem; color: var(--text-muted); }
        .brand-check {
            position: absolute; top: .4rem; right: .4rem;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); color: #fff;
            font-size: .65rem; display: flex; align-items: center; justify-content: center;
            font-weight: 700;
        }

        /* ── Manual brand input ──────────────────────────────── */
        .wizard-manual { margin-top: .5rem; }
        .form-label { display: block; font-size: .8rem; font-weight: 600; color: var(--text-muted); margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .04em; }
        .form-input {
            width: 100%; padding: .65rem .9rem; border-radius: 10px;
            border: 1.5px solid var(--border); background: var(--surface-2);
            color: var(--text); font-size: .9rem; font-family: inherit;
            transition: border-color .15s; box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: var(--accent); }
        select.form-input { cursor: pointer; }

        /* ── Shelf cards ─────────────────────────────────────── */
        .shelf-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: .6rem; max-height: 360px; overflow-y: auto;
            padding-right: 4px;
        }
        .shelf-card {
            display: flex; align-items: center; gap: .75rem;
            padding: .85rem 1rem; border-radius: 12px;
            border: 2px solid var(--border); cursor: pointer;
            transition: all .15s; position: relative;
            background: var(--surface-2);
        }
        .shelf-card:hover { border-color: var(--accent); background: rgba(99,102,241,.05); }
        .shelf-card.selected { border-color: var(--accent); background: rgba(99,102,241,.08); }
        .shelf-card-icon { color: var(--accent); flex-shrink: 0; }
        .shelf-card-icon svg { width: 22px; height: 22px; }
        .shelf-card-name { font-size: .875rem; font-weight: 600; flex: 1; }
        .shelf-check {
            position: absolute; top: .4rem; right: .4rem;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); color: #fff;
            font-size: .65rem; display: flex; align-items: center; justify-content: center;
            font-weight: 700;
        }

        /* ── Step 3 — rows + dates ───────────────────────────── */
        .step3-section { display: flex; flex-direction: column; gap: .5rem; }
        .step3-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
        .rows-list { display: flex; flex-direction: column; gap: .5rem; max-height: 200px; overflow-y: auto; padding-right: 4px; }
        .row-option {
            display: flex; align-items: center; gap: .75rem;
            padding: .65rem .9rem; border-radius: 10px;
            border: 1.5px solid var(--border); cursor: pointer;
            transition: all .15s; background: var(--surface-2);
        }
        .row-option:hover { border-color: var(--accent); }
        .row-option.checked { border-color: var(--accent); background: rgba(99,102,241,.07); }
        .row-option input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
        .row-option-info { flex: 1; min-width: 0; }
        .row-option-title { display: block; font-size: .875rem; font-weight: 600; }
        .row-option-preview { font-size: .75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .row-option-count { font-size: .75rem; font-weight: 600; color: var(--accent); flex-shrink: 0; }

        /* ── Buttons ─────────────────────────────────────────── */
        .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.2rem; border-radius: 10px; font-size: .875rem; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover, #4f46e5); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
        .btn-secondary { background: var(--surface-2); color: var(--text); border: 1.5px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
